<style>
:root{--bg:#f4f6fa;--card:#fff;--fg:#17233b;--mut:#6b778c;--line:#dde3ee;--acc:#1d4ed8;--accfg:#fff;--ok:#157347;--okbg:#e3f4ea;--bad:#b42318;--badbg:#fdebea}

.err{color:var(--bad);margin:10px 0 0;font-size:14px}

.seg input{position:absolute;opacity:0}
.seg label:has(input:checked).y{background:var(--okbg);border-color:var(--ok);color:var(--ok)}

<h1>派驻人员信息核对</h1>
<p class="sub">请输入工号，核对公司登记的个人信息是否正确。信息仅用于核对，请勿转发他人。</p>

<section id="s1" class="card">
  <label for="eid">工号</label>
  <input id="eid" type="text" inputmode="numeric" autocomplete="off" placeholder="请输入工号">
  <p class="err" id="e1" hidden></p>
  <div style="height:12px"></div>
  <button id="go">查询</button>
</section>

<section id="s2" hidden>
  <div class="card who"><b id="nm"></b><span id="idn"></span></div>

    <label for="extra">信息有误？请在此说明正确内容（无误可不填）</label>
    <textarea id="extra" rows="3"></textarea>
  </div>
    <button id="submit">确认信息无误并提交</button>
  <div style="height:10px"></div>
  <button class="ghost" id="back">返回重新输入</button>
</section>

<section id="s3" hidden>

    <button id="copy">复制结果</button>
  </div>
</section>

  const km=await crypto.subtle.importKey("raw",enc.encode(id),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:DATA.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  try{
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unhex(e.iv)},key,unhex(e.ct));
    return JSON.parse(dec.decode(pt));
  }catch(_){return null}
}
function show(r){
  $("nm").textContent=r.fields[0][1]; $("idn").textContent="工号 "+r.id;
  $("fields").innerHTML="";
  r.fields.forEach(([k,v])=>{
    const d=document.createElement("div"); d.className="field";
    d.innerHTML='<div class="k"></div><div class="v" style="margin-bottom:0"></div>';
    d.querySelector(".k").textContent=k; d.querySelector(".v").textContent=v||"（空）";
    $("fields").appendChild(d);
  });
  $("s1").hidden=true; $("s2").hidden=false; window.scrollTo(0,0);
}
$("go").onclick=async()=>{
  const raw=$("eid").value, id=norm(raw); $("e1").hidden=true;
  if(!id){$("e1").textContent="请输入工号";$("e1").hidden=false;return}
  $("go").disabled=true; $("go").textContent="查询中…";
  const r=await lookup(id);
  $("go").disabled=false; $("go").textContent="查询";
  if(!r){$("e1").textContent="未找到该工号，请检查后重试；如仍无法查询请联系负责人。";$("e1").hidden=false;return}
  rec=r; eid=r.id; show(r);
};
$("eid").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("back").onclick=()=>{$("s2").hidden=true;$("s1").hidden=false;$("eid").value="";rec=null};
$("submit").onclick=async()=>{
  const extra=$("extra").value.trim();
  const payload={id:eid,name:rec.fields[0][1],confirmed:true,extra:extra,time:new Date().toISOString()};
  const text=JSON.stringify(payload,null,1);
  $("submit").disabled=true;
  let sent=false;
  if(SUBMIT_URL){
    try{await fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});sent=true}catch(_){}
  }
  $("s2").hidden=true;$("s3").hidden=false;
  if(sent){$("doneMsg").textContent="已确认并提交，感谢核对。"}
  else{$("doneMsg").textContent=SUBMIT_URL?"提交失败，请复制下方结果发给负责人。":"核对完成。";$("manual").hidden=false;$("payload").textContent=text}
};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("payload").textContent);$("copy").textContent="已复制"}catch(_){const r=document.createRange();r.selectNodeContents($("payload"));getSelection().removeAllRanges();getSelection().addRange(r)}};
</script></body></html>
